<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E1420"><title>Job 3 Data Pipeline · Interactive Teaching Deck</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0E1420;color:#EAF0F8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}section{width:min(620px,100%)}h1{font-size:clamp(1.8rem,5vw,3rem)}p,small{color:#9DABC2;line-height:1.5}.bar{height:10px;border-radius:999px;background:#223049;overflow:hidden;margin:22px 0}.bar span{display:block;height:100%;width:25%;border-radius:999px;background:#34E0C4;animation:load 1.2s ease-in-out infinite alternate}pre{display:none;margin-top:18px;padding:14px;text-align:left;white-space:pre-wrap;border:1px solid #FF7E6B;border-radius:12px;background:rgba(255,126,107,.08)}button{margin-top:14px;padding:10px 15px;border-radius:10px;border:1px solid #2A3A55;background:#1A2334;color:#EAF0F8;font:inherit}@keyframes load{to{transform:translateX(300%)}}</style></head><body><main><section><h1>Loading the interactive lesson…</h1><p>Preparing the full animated Job 3 learning material.</p><div class="bar"><span></span></div><small id="status">Checking lesson bundle</small><pre id="err"></pre><button id="retry" hidden>Retry</button></section></main><script>(()=>{const N=3,V='20260730-v9',status=document.getElementById('status'),err=document.getElementById('err'),retry=document.getElementById('retry');async function get(u){const r=await fetch(u+'?v='+V,{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+r.statusText+' — '+u);return(await r.text()).trim()}async function run(){err.style.display='none';retry.hidden=true;try{let s='';for(let i=0;i<N;i++){status.textContent=`Loading lesson ${i+1} of ${N}`;s+=await get(`bundle-v9.part${String(i).padStart(2,'0')}.b64`)}status.textContent='Opening lesson';const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('Interactive Teaching Deck')||html.length<50000)throw Error('Lesson content did not pass validation.');document.open();document.write(html);document.close()}catch(e){status.textContent='The lesson could not open';err.textContent=String(e);err.style.display='block';retry.hidden=false}}retry.onclick=run;run()})();</script></body></html>
