<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <title>Job 3 Data Pipeline · Interactive Teaching Deck</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#0E1420;color:#EAF0F8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .loader{width:min(620px,100%)}
    h1{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px}
    p{color:#9DABC2;line-height:1.5}
    .bar{height:10px;border-radius:999px;background:#223049;overflow:hidden;margin:22px 0}
    .bar span{display:block;height:100%;width:25%;border-radius:999px;background:#34E0C4;animation:load 1.2s ease-in-out infinite alternate}
    small{display:block;color:#9DABC2;line-height:1.5}
    .error{display:none;margin-top:18px;padding:14px 16px;border:1px solid #FF7E6B;border-radius:12px;background:rgba(255,126,107,.08);color:#FFD7D0;text-align:left;white-space:pre-wrap;word-break:break-word}
    button{margin-top:16px;border:1px solid #2A3A55;border-radius:10px;background:#1A2334;color:#EAF0F8;padding:10px 15px;font:inherit;cursor:pointer}
    @keyframes load{to{transform:translateX(300%)}}
  </style>
</head>
<body>
<main>
  <section class="loader">
    <h1>Loading the interactive lesson…</h1>
    <p>The complete lesson is being prepared in your browser.</p>
    <div class="bar"><span></span></div>
    <small id="status">Checking lesson files</small>
    <div class="error" id="errorBox"></div>
    <button id="retry" type="button" hidden>Retry</button>
  </section>
</main>
<script>
(() => {
  const status = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');
  const retry = document.getElementById('retry');
  const repo = 'Prakashash18/AI-Applications-Job3-Data-Pipeline-Interactive';
  const version = '20260730-1';

  async function fetchText(url){
    const response = await fetch(url + (url.includes('?') ? '&' : '?') + 'v=' + version, {cache:'no-store'});
    if(!response.ok) throw new Error(`${response.status} ${response.statusText} — ${url}`);
    return (await response.text()).trim();
  }

  async function loadParts(){
    const names = [0,1,2,3].map(n => `index.part0${n}.b64`);
    const sources = [
      name => `.site/${name}`,
      name => `https://raw.githubusercontent.com/${repo}/main/.site/${name}`
    ];
    let lastError;

    for(const makeUrl of sources){
      const parts = [];
      try{
        for(let i=0;i<names.length;i++){
          status.textContent = `Loading lesson data ${i+1} of ${names.length}`;
          parts.push(await fetchText(makeUrl(names[i])));
        }
        const joined = parts.join('');
        if(!joined || joined.length < 1000) throw new Error('Lesson bundle is incomplete.');
        return joined;
      }catch(error){
        lastError = error;
      }
    }
    throw lastError || new Error('Could not load the lesson bundle.');
  }

  async function openLesson(){
    errorBox.style.display = 'none';
    retry.hidden = true;
    status.textContent = 'Checking lesson files';
    try{
      const encoded = await loadParts();
      status.textContent = 'Opening the lesson';
      if(!('DecompressionStream' in window)){
        throw new Error('This browser does not support DecompressionStream. Update Safari, Chrome, Edge, or Firefox and try again.');
      }
      const binary = atob(encoded);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      if(!html.includes('<html') || !html.includes('Interactive Teaching Deck')){
        throw new Error('The lesson file was downloaded but failed validation.');
      }
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error(error);
      status.textContent = 'The lesson could not open';
      errorBox.textContent = `${error.name || 'Error'}: ${error.message || error}`;
      errorBox.style.display = 'block';
      retry.hidden = false;
    }
  }

  retry.addEventListener('click', openLesson);
  openLesson();
})();
</script>
</body>
</html>
