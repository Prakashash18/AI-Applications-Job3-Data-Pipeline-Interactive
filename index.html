async function openLesson(){errorBox.style.display='none';retry.hidden=true;status.textContent='Checking lesson files';try{const encoded=await loadParts();status.textContent='Opening the lesson';if(!('DecompressionStream'in window))throw new Error('This browser does not support DecompressionStream. Update Safari, Chrome, Edge, or Firefox.');const binary=atob(encoded),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();if(!html.includes('<html'))throw new Error('The lesson file failed validation.');document.open();document.write(patchHtml(html));document.close()}catch(e){console.error(e);status.textContent='The lesson could not open';errorBox.textContent=(e.name||'Error')+': '+(e.message||e);errorBox.style.display='block';retry.hidden=false}}retry.addEventListener('click',openLesson);openLesson();})();
