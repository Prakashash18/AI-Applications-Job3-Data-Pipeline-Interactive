<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <title>Job 3 Data Pipeline · Interactive Teaching Deck</title>
  <style>
    html,body{height:100%;margin:0;background:#0E1420;color:#EAF0F8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .loader{width:min(520px,100%)}
    .bar{height:10px;border-radius:999px;background:#223049;overflow:hidden;margin:22px 0}
    .bar span{display:block;height:100%;width:25%;border-radius:999px;background:#34E0C4;animation:load 1.2s ease-in-out infinite alternate}
    small{color:#9DABC2}
    @keyframes load{to{transform:translateX(300%)}}
  </style>
</head>
<body>
<main><section class="loader"><h1>Loading the interactive lesson…</h1><div class="bar"><span></span></div><small id="status">Preparing the teaching deck</small></section></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const paths=[0,1,2,3].map(n=>`.site/index.part0${n}.b64`);
    const parts=[];
    for(let i=0;i<paths.length;i++){
      status.textContent=`Loading lesson data ${i+1} of ${paths.length}`;
      const r=await fetch(paths[i],{cache:'no-store'});
      if(!r.ok) throw new Error(`Could not load ${paths[i]}`);
      parts.push((await r.text()).trim());
    }
    status.textContent='Opening the lesson';
    const binary=atob(parts.join(''));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('This browser needs a newer version to open the lesson.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    status.textContent=error.message+' Try refreshing or use a current version of Safari, Chrome, Edge, or Firefox.';
  }
})();
</script>
</body>
</html>
