name: Build direct static lesson

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-direct-page.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild direct index.html
        shell: bash
        run: |
          set -euo pipefail
          cat bundle-v9.part00.b64 bundle-v9.part01.b64 bundle-v9.part02.b64 \
            | tr -d '\r\n\t ' > /tmp/lesson.b64
          base64 --decode /tmp/lesson.b64 > /tmp/lesson.html.gz
          gzip -dc /tmp/lesson.html.gz > index.html
          test "$(wc -c < index.html)" -gt 50000
          grep -q "Interactive Teaching Deck" index.html
          echo "Built direct index.html: $(wc -c < index.html) bytes"

      - name: Commit rebuilt page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html is already current"
          else
            git commit -m "Build direct static lesson [skip ci]"
            git push origin HEAD:main
          fi
